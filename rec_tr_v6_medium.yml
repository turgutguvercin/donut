# PaddleOCR Apache-2.0 reference: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf
Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/PP-OCRv6_medium_rec_tr
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 2000
  cal_metric_during_train: false
  pretrained_model: ./pretrained/PP-OCRv6_medium_rec_tr
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: ./train_data/turkish-recognition-200k-v4/paddle-v6-medium/turkish_dict.txt
  max_text_length: 256
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_ppocrv6_medium.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 4096
  seed: 20261015
  uniform_output_enabled: false
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: lightsvtr
          dims: 192
          depth: 2
          mlp_ratio: 4.0
          local_kernel: 7
          use_guide: false
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 512
        max_text_length: 256
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false
  is_filter: false
Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/turkish-recognition-200k-v4
    label_file_list:
    - ./train_data/turkish-recognition-200k-v4/train-recommended.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 4096
        padding: true
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 1
    drop_last: false
    num_workers: 2
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/turkish-recognition-200k-v4
    label_file_list:
    - ./train_data/turkish-recognition-200k-v4/val-recommended.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 4096
        padding: true
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
TurkishRecognitionPooling:
  enabled: true
  mode: inference_pool_train_and_eval
  ctc_width_stride: 8
TurkishWidthBuckets:
  enabled: true
  widths:
  - 320
  - 640
  - 960
  - 1280
  - 1920
  - 2560
  - 4096
  batch_sizes:
    320: 32
    640: 16
    960: 8
    1280: 8
    1920: 4
    2560: 2
    4096: 1
  seed: 20261015
  launcher: train_paddle_tr_v6.py
